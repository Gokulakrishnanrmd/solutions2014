name: Build Alphabet Runner APK

on:
  push:
    branches: [ main, 'claude/*' ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: alphabet_runner
        run: flutter pub get

      - name: Analyze code
        working-directory: alphabet_runner
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        working-directory: alphabet_runner
        run: flutter build apk --debug --no-shrink

      - name: Build release APK
        working-directory: alphabet_runner
        run: flutter build apk --release --no-shrink

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alphabet-runner-debug-apk
          path: alphabet_runner/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: alphabet-runner-release-apk
          path: alphabet_runner/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "## Build Complete! 🎮" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**How to install on Android:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the APK to your Android device" >> $GITHUB_STEP_SUMMARY
          echo "2. Go to Settings → Security → Enable 'Unknown Sources'" >> $GITHUB_STEP_SUMMARY
          echo "3. Tap the downloaded APK to install" >> $GITHUB_STEP_SUMMARY
          echo "4. Open **Alphabet Runner** and have fun! 🦊" >> $GITHUB_STEP_SUMMARY
